name: Build OpenCode Plugin

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'agents/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsup.config.ts'
  pull_request:
    paths:
      - 'src/**'
      - 'agents/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'tsup.config.ts'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.node-version'

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Verify agent prompts are embedded
        run: node scripts/verify-agents.mjs

