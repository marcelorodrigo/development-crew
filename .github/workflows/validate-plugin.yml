name: Validate Plugin Manifests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin.json and marketplace.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Validate .github/plugin/plugin.json
        run: python3 validation/validate_github_plugin.py

      - name: Validate .github/plugin/marketplace.json
        run: python3 validation/validate_github_plugin.py marketplace

      - name: Validate .claude-plugin/plugin.json
        run: python3 validation/validate_claude_plugin.py

      - name: Validate .claude-plugin/marketplace.json
        run: python3 validation/validate_claude_plugin.py marketplace

      - name: Validate .omp-plugin/marketplace.json
        run: python3 validation/validate_omp_plugin.py

      - name: Validate version consistency
        run: python3 validation/validate_versions.py

      - name: Validate skill files have required frontmatter
        run: python3 validation/validate_skills.py
